<style>
  #adj,
  #went,
  #ate,
  #saw,
  #enjoyed {
    height: 2.6rem;
    overflow: hidden;
    display: inline-block;
    vertical-align: middle;
    min-width: 160px;
    line-height: 2.6rem;
  }

  .inshade {
    box-shadow:
      rgba(50, 50, 93, 0.25) 0px 30px 60px -12px inset,
      rgba(0, 0, 0, 0.3) 0px 18px 36px -18px inset;
  }

  .slot-sentence-col {
    font-size: 1.15rem;
    font-weight: 500;
  }

  .form-check-input {
    cursor: pointer;
  }

  .form-check-label {
    cursor: pointer;
  }

  .slot-reel-item {
    line-height: 2.6rem;
  }

  .combo-svg-wrapper {
    overflow: visible !important;
    padding: 0 4px;
  }

  .combo-svg-wrapper svg {
    height: 36px;
    width: auto;
    display: inline-block;
    vertical-align: middle;
    overflow: visible !important;
  }

  .combo-svg-wrapper path {
    transition: stroke 0.3s ease, filter 0.3s ease;
  }

  .combo-active {
    stroke: #00ff66 !important;
    filter: drop-shadow(0 0 6px rgba(0, 255, 102, 0.95));
  }

  .you-win-badge {
    font-size: 1.4rem;
    font-weight: 800;
    color: #00ff66 !important;
    text-shadow: 0 0 8px rgba(0, 255, 102, 0.8), 0 0 16px rgba(0, 255, 102, 0.5);
    display: inline-block;
    vertical-align: middle;
  }

  /* Active Field & Speech Recognition Highlights */
  .slot-field-active {
    border: 2.5px solid #0d6efd !important;
    box-shadow: 0 0 12px rgba(13, 110, 253, 0.6), inset 0 0 6px rgba(13, 110, 253, 0.2) !important;
    transform: scale(1.02);
    transition: all 0.25s ease-in-out;
  }

  .slot-row {
    cursor: pointer;
    transition: background-color 0.25s ease, box-shadow 0.25s ease;
    border-radius: 8px;
    padding: 4px 6px;
  }

  .slot-row:hover {
    background-color: rgba(13, 110, 253, 0.03);
  }

  .slot-row-active {
    background-color: rgba(13, 110, 253, 0.06);
    border-left: 4px solid #0d6efd;
  }

  .mic-listening {
    animation: mic-pulse 1.4s infinite;
  }

  @keyframes mic-pulse {
    0% {
      box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7);
    }
    70% {
      box-shadow: 0 0 0 10px rgba(220, 53, 69, 0);
    }
    100% {
      box-shadow: 0 0 0 0 rgba(220, 53, 69, 0);
    }
  }

  .speech-badge {
    transition: all 0.3s ease;
  }
</style>

<script>
  $(function () {
    $(".item").removeClass("active disabled");
    $("#weekend").addClass("active disabled");

    const ORIGINAL_DATA = {
      adj: ["great", "amazing", "fantastic", "wonderful", "interesting", "exciting", "fun", "fine", "good", "busy"],
      went: ["the beach", "the park", "the zoo", "the museum", "the library", "the store", "the aquarium", "a party", "a concert", "the amusement park"],
      saw: ["my friend", "a deer", "my grandmother", "a movie", "a game", "my cousin", "a parade", "a concert", "a play", "my teacher"],
      ate: ["a hotdog", "a hamburger", "a pizza", "a sandwich", "a salad", "a taco", "a burrito", "a cookie", "a cake", "a pie"],
      enjoyed: ["playing games", "watching a movie", "playing sports", "reading a book", "listening to music", "dancing", "singing", "drawing", "painting", "writing"]
    };

    const COMBO_MAP = {
      1: "single",
      2: "double",
      3: "triple",
      4: "quadruple",
      5: "quintuple"
    };

    let pools = {};
    let statusMap = {};
    let totalGreenChecks = 0;
    let achievedCombos = new Set();

    let activeCatKey = 'adj';
    let recognition = null;
    let isListening = false;
    let speechSupported = false;

    function toId(str) {
      return str.replace(/ /g, '');
    }

    function normalizeText(text) {
      return (text || '').toLowerCase().replace(/[^a-z0-9\s]/g, '').replace(/\s+/g, ' ').trim();
    }

    function clearAllHighlights() {
      activeCatKey = null;
      $('.slot-row').removeClass('slot-row-active');
      $('#adj, #went, #saw, #ate, #enjoyed').removeClass('slot-field-active');
    }

    function setActiveCategory(catKey) {
      clearAllHighlights();
      // Fields should ONLY be highlighted when the mic is listening
      if (!isListening) return;
      if (!catKey || !ORIGINAL_DATA[catKey]) return;

      // Do not highlight if this field already has a selection
      let selected = $(`input[name="predict_${catKey}"]:checked`).val();
      if (selected) return;

      activeCatKey = catKey;
      $(`.slot-row[data-catkey="${catKey}"]`).addClass('slot-row-active');
      $('#' + catKey).addClass('slot-field-active');
    }

    function autoAdvanceActiveCategory() {
      if (!isListening) {
        clearAllHighlights();
        return;
      }
      // Find first category in order that still has active pool items and no prediction selected yet
      for (let key in ORIGINAL_DATA) {
        if (pools[key] && pools[key].length > 0) {
          let selected = $(`input[name="predict_${key}"]:checked`).val();
          if (!selected) {
            setActiveCategory(key);
            return;
          }
        }
      }
      // If all fields have a prediction selected, clear all highlights
      clearAllHighlights();
    }

    function matchSpokenOption(transcript) {
      const spoken = normalizeText(transcript);
      if (!spoken) return null;

      function checkCategory(catKey) {
        if (!pools[catKey] || pools[catKey].length === 0) return null;
        let selected = $(`input[name="predict_${catKey}"]:checked`).val();
        if (selected) return null; // Already selected

        let items = ORIGINAL_DATA[catKey];
        for (let item of items) {
          if (statusMap[catKey][item] !== 'active') continue;
          let normItem = normalizeText(item);
          // Check exact match or phrase containment
          if (spoken === normItem || spoken.includes(normItem) || normItem.includes(spoken)) {
            return { catKey, item };
          }
        }
        return null;
      }

      // Priority 1: Check active focused category
      if (activeCatKey) {
        let match = checkCategory(activeCatKey);
        if (match) return match;
      }

      // Priority 2: Check all other unselected active categories
      for (let catKey in ORIGINAL_DATA) {
        if (catKey === activeCatKey) continue;
        let match = checkCategory(catKey);
        if (match) return match;
      }

      return null;
    }

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        speechSupported = false;
        $("#speech-unsupported-alert").removeClass("d-none");
        $("#MIC_TOGGLE").prop("disabled", true).addClass("disabled");
        return;
      }

      speechSupported = true;
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = 'en-US';
      recognition.maxAlternatives = 3;

      recognition.onstart = function () {
        isListening = true;
        $("#MIC_TOGGLE").removeClass("btn-outline-primary").addClass("btn-danger mic-listening");
        $("#mic-icon").text("mic");
        $("#mic-btn-text").text("Stop Mic");
        autoAdvanceActiveCategory();
      };

      recognition.onend = function () {
        if (isListening) {
          try {
            recognition.start();
          } catch (e) {
            isListening = false;
            resetMicUI();
          }
        } else {
          resetMicUI();
        }
      };

      recognition.onerror = function (event) {
        if (event.error === 'no-speech') return;
        if (event.error === 'not-allowed') {
          isListening = false;
          resetMicUI();
        }
      };

      recognition.onresult = function (event) {
        for (let i = event.resultIndex; i < event.results.length; i++) {
          if (event.results[i].isFinal) {
            let altCount = event.results[i].length;
            let matched = null;
            let heardText = "";

            for (let j = 0; j < altCount; j++) {
              heardText = event.results[i][j].transcript;
              let norm = normalizeText(heardText);

              // Check if user spoke "spin"
              if (norm === 'spin' || norm.includes('spin')) {
                if (!$("#SPIN").hasClass("disabled")) {
                  runit();
                  return;
                }
              }

              matched = matchSpokenOption(heardText);
              if (matched) break;
            }

            if (matched) {
              let { catKey, item } = matched;
              let radioId = `#radio_${catKey}_${toId(item)}`;
              $(radioId).prop("checked", true).trigger("change");
              let isAllSelected = updateSpinButtonState();
              autoAdvanceActiveCategory();

              // Auto spin once all fields have a value after speech is recognized
              if (isAllSelected) {
                setTimeout(function () {
                  if (!$("#SPIN").hasClass("disabled")) {
                    runit();
                  }
                }, 400);
              }
            }
          }
        }
      };
    }

    function resetMicUI() {
      isListening = false;
      $("#MIC_TOGGLE").removeClass("btn-danger mic-listening").addClass("btn-outline-primary");
      $("#mic-icon").text("mic");
      $("#mic-btn-text").text("Start Mic");
      clearAllHighlights();
    }

    function populateSlotReels() {
      $("#adj, #went, #saw, #ate, #enjoyed").empty();
      for (let catKey in ORIGINAL_DATA) {
        let slotElemId = "#" + catKey;
        $(slotElemId).append(`<div id="${catKey}_empty" class="fs-3 text-center YM slot-reel-item">&nbsp;</div>`);
        for (let item of ORIGINAL_DATA[catKey]) {
          let itemId = catKey + "_" + toId(item);
          $(slotElemId).append(`<div id="${itemId}" class="fs-3 text-center YM slot-reel-item">${item}</div>`);
        }
      }
    }

    function updateSpinButtonState() {
      let allPoolsEmpty = true;
      let allSelected = true;

      for (let catKey in ORIGINAL_DATA) {
        if (pools[catKey] && pools[catKey].length > 0) {
          allPoolsEmpty = false;
          let selected = $(`input[name="predict_${catKey}"]:checked`).val();
          if (!selected) {
            allSelected = false;
          }
        }
      }

      if (allPoolsEmpty) {
        $("#SPIN").addClass("disabled").prop("disabled", true);
        $("#RESET_GAME").removeClass("btn-outline-secondary").addClass("btn-success");
        return false;
      }

      if (allSelected) {
        $("#SPIN").removeClass("disabled").prop("disabled", false);
        return true;
      } else {
        $("#SPIN").addClass("disabled").prop("disabled", true);
        return false;
      }
    }

    function initGame() {
      pools = {
        adj: ORIGINAL_DATA.adj.slice(),
        went: ORIGINAL_DATA.went.slice(),
        saw: ORIGINAL_DATA.saw.slice(),
        ate: ORIGINAL_DATA.ate.slice(),
        enjoyed: ORIGINAL_DATA.enjoyed.slice()
      };

      statusMap = {};
      for (let catKey in ORIGINAL_DATA) {
        statusMap[catKey] = {};
        for (let item of ORIGINAL_DATA[catKey]) {
          statusMap[catKey][item] = 'active';
        }
        $("#" + catKey).scrollTop(0);
      }

      totalGreenChecks = 0;
      achievedCombos.clear();

      $("#score-checks").text(0);
      $("#you-win-text").addClass("d-none");

      // Reset Reset button to outline secondary
      $("#RESET_GAME").removeClass("btn-success").addClass("btn-outline-secondary");

      // Reset Combo SVG paths to gray stroke
      $("#single, #double, #triple, #quadruple, #quintuple")
        .removeClass("combo-active")
        .css("stroke", "#646464")
        .attr("stroke", "#646464");

      renderAllOptionGroups(true);
      updateSpinButtonState();
      autoAdvanceActiveCategory();
    }

    function renderAllOptionGroups(clearChecked = false) {
      for (let catKey in ORIGINAL_DATA) {
        renderOptionGroup(catKey, clearChecked);
      }
    }

    function renderOptionGroup(catKey, clearChecked = false) {
      let groupContainer = $("#group-" + catKey);
      let currentlyChecked = clearChecked ? null : groupContainer.find(`input[name="predict_${catKey}"]:checked`).val();

      groupContainer.empty();

      let items = ORIGINAL_DATA[catKey];

      items.forEach((item) => {
        let st = statusMap[catKey][item];
        let sanitizedId = `radio_${catKey}_${toId(item)}`;

        if (st === 'active') {
          let isChecked = (!clearChecked && currentlyChecked === item) ? 'checked' : '';
          let radioHtml = `
          <div class="form-check form-check-inline me-2 my-0">
            <input class="form-check-input" type="radio" name="predict_${catKey}" id="${sanitizedId}" value="${item}" ${isChecked}>
            <label class="form-check-label text-dark fs-6" for="${sanitizedId}">${item}</label>
          </div>
        `;
          groupContainer.append(radioHtml);
        } else if (st === 'green_check') {
          let badgeHtml = `
          <span class="text-success fw-bold me-2 my-0 d-inline-flex align-items-center fs-6">
            <i class="material-icons fs-6 me-1">check_circle</i> ${item}
          </span>
        `;
          groupContainer.append(badgeHtml);
        }
      });
    }

    function runit() {
      let roundHits = 0;

      for (let catKey in ORIGINAL_DATA) {
        let pool = pools[catKey];
        if (pool.length === 0) continue;

        let selectedItem = $(`input[name="predict_${catKey}"]:checked`).val();

        let randIndex = Math.floor(Math.random() * pool.length);
        let hitItem = pool[randIndex];

        pool.splice(randIndex, 1);

        if (selectedItem === hitItem) {
          statusMap[catKey][hitItem] = 'green_check';
          totalGreenChecks++;
          roundHits++;

          // Clear field (slot box) for items we get hits on
          $("#" + catKey).scrollTop(0);
        } else {
          statusMap[catKey][hitItem] = 'removed';
          spinit(catKey, catKey + '_' + toId(hitItem));
        }

        renderOptionGroup(catKey);
      }

      // Light up corresponding combo SVG path and award combo bonus value when first unlocked
      if (COMBO_MAP[roundHits]) {
        let comboPathId = COMBO_MAP[roundHits];
        if (!achievedCombos.has(comboPathId)) {
          achievedCombos.add(comboPathId);
          $("#" + comboPathId)
            .addClass("combo-active")
            .css("stroke", "#00ff66")
            .attr("stroke", "#00ff66");

          // Award bonus equal to the value of the combo (single: +1, double: +2, triple: +3, quadruple: +4, quintuple: +5)
          totalGreenChecks += roundHits;

          // Check if all 5 combos have been achieved!
          if (achievedCombos.size === 5) {
            $("#you-win-text").removeClass("d-none");
          }
        }
      }

      $("#score-checks").text(totalGreenChecks);

      updateSpinButtonState();
      autoAdvanceActiveCategory();
    }

    // Set active field on row click
    $(document).on('click', '.slot-row', function () {
      let catKey = $(this).data('catkey');
      if (catKey && isListening) {
        setActiveCategory(catKey);
      }
    });

    $(document).on('change', 'input[type="radio"]', function () {
      let catKey = $(this).attr('name').replace('predict_', '');
      updateSpinButtonState();
      autoAdvanceActiveCategory();
    });

    $("#MIC_TOGGLE").on('click', function () {
      if (!speechSupported || !recognition) return;
      if (isListening) {
        isListening = false;
        try {
          recognition.stop();
        } catch (e) {}
        resetMicUI();
      } else {
        try {
          recognition.start();
        } catch (e) {
          isListening = false;
          resetMicUI();
        }
      }
    });

    $("#SPIN").on('click', function () {
      if ($(this).hasClass("disabled")) return;
      runit();
    });

    $("#RESET_GAME").on('click', function () {
      initGame();
    });
