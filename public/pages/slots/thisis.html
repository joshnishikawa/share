<style>
  #names,
  #relationships,
  #personalities,
  #skills {
    height: 2.6rem;
    overflow: hidden;
    display: inline-block;
    vertical-align: middle;
    min-width: 160px;
    line-height: 2.6rem;
  }

  .inshade {
    box-shadow:
      rgba(50, 50, 93, 0.25) 0px 30px 60px -12px inset,
      rgba(0, 0, 0, 0.3) 0px 18px 36px -18px inset;
  }

  .slot-sentence-col {
    font-size: 1.15rem;
    font-weight: 500;
  }

  .form-check-input {
    cursor: pointer;
  }

  .form-check-label {
    cursor: pointer;
  }

  .slot-reel-item {
    line-height: 2.6rem;
  }

  .combo-svg-wrapper {
    overflow: visible !important;
    padding: 0 4px;
  }

  .combo-svg-wrapper svg {
    height: 36px;
    width: auto;
    display: inline-block;
    vertical-align: middle;
    overflow: visible !important;
  }

  .combo-svg-wrapper path {
    transition: stroke 0.3s ease, filter 0.3s ease;
  }

  .combo-active {
    stroke: #00ff66 !important;
    filter: drop-shadow(0 0 6px rgba(0, 255, 102, 0.95));
  }

  .you-win-badge {
    font-size: 1.4rem;
    font-weight: 800;
    color: #00ff66 !important;
    text-shadow: 0 0 8px rgba(0, 255, 102, 0.8), 0 0 16px rgba(0, 255, 102, 0.5);
    display: inline-block;
    vertical-align: middle;
  }
</style>

<div class="container-fluid py-1">
  <!-- Game Control & Score Bar -->
  <div class="d-flex flex-wrap align-items-center justify-content-between mb-2 pb-1 border-bottom">
    <div class="d-flex align-items-center me-3">
      <button id="SPIN" class="btn btn-lg btn-success fw-bold me-2 shadow-sm px-4 disabled" disabled>
        <i class="material-icons align-middle me-1 fs-5">casino</i> SPIN
      </button>
      <button id="RESET_GAME" class="btn btn-lg btn-outline-secondary fw-bold me-3 shadow-sm px-4">
        <i class="material-icons align-middle me-1 fs-5">refresh</i> Reset
      </button>
    </div>

    <div class="text-center flex-grow-1">
      <span id="you-win-text" class="fw-bold fs-4 text-success d-none align-middle">🎉 You Win!</span>
    </div>

    <div class="d-flex align-items-center gap-3 fs-6">
      <div class="fs-3">Score: <strong class="text-success" id="score-checks">0</strong></div>
      <div id="combo-container" class="combo-svg-wrapper d-inline-flex align-items-center me-2">
        <svg
           width="380mm"
           height="157.86459mm"
           viewBox="-20 -20 380 157.86459"
           version="1.1"
           id="svg5"
           style="overflow: visible;"
           xmlns="http://www.w3.org/2000/svg"
           xmlns:svg="http://www.w3.org/2000/svg">
          <defs id="defs2" />
          <path
             style="fill:none;stroke:#646464;stroke-width:10;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:1.5;stroke-dasharray:none;paint-order:markers fill stroke;stroke-opacity:1;"
             id="quadruple"
             d="m 308.22931,48.390189 c 1.26133,90.697891 80.15769,9.576168 -10.54019,10.837493 -90.6979,1.26133 -9.57616,80.157698 -10.83749,-10.540195 -1.26133,-90.697882 -80.15771,-9.576168 10.54018,-10.837496 90.69789,-1.261328 9.57618,-80.157684 10.8375,10.540198 z" />
          <path
             id="triple"
             style="fill:none;stroke:#646464;stroke-width:14.7238;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:1.5;paint-order:markers fill stroke;stroke-opacity:1;"

             d="M 180.00002,50 C 93.397475,-36.602541 55.358999,105.35898 173.66027,73.660254 291.96154,41.961525 188.03849,-61.961524 156.33976,56.339746 124.64103,174.64102 266.60256,136.60254 180.00002,50 Z" />
          <path
             d="m 105.31409,57.86459 c 15.98401,2.550742 26.21508,8.130625 30.73619,16.717051 a 19.40796,19.40796 0 1 1 -34.3457,18.084452 C 97.183469,84.079674 98.372329,72.486705 105.31409,57.86459 Z m 0,0 C 89.330099,55.313848 79.099029,49.734004 74.577929,41.147579 A 19.40796,19.40796 0 1 1 108.92363,23.063123 c 4.52112,8.586428 3.33223,20.179348 -3.60954,34.801467 z"
             id="double"
             style="fill:none;stroke:#646464;stroke-width:10;stroke-dasharray:none;stroke-opacity:1;" />
          <path
             id="single"
             style="fill:none;stroke:#646464;stroke-width:10;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:1.5;paint-order:markers fill stroke;stroke-opacity:1;"
             d="M 65.628174,82.550499 A 30.314087,30.314087 0 0 1 35.314087,112.86459 30.314087,30.314087 0 0 1 5,82.550499 30.314087,30.314087 0 0 1 35.314087,52.236412 30.314087,30.314087 0 0 1 65.628174,82.550499 Z" />
        </svg>
      </div>
    </div>
  </div>

  <!-- Row 1: Name -->
  <div class="row align-items-center py-0">
    <div class="col-6 slot-sentence-col d-flex align-items-center justify-content-end YM fs-1">
      <span class="me-2">This is</span>
      <div id="names" class="inshade border rounded-3 bg-light text-center px-2"></div>
      <span class="ms-1">.</span>
    </div>
    <div class="col-6">
      <div id="group-names" class="d-flex flex-wrap align-items-center"></div>
    </div>
  </div>
  <hr class="my-1">

  <!-- Row 2: Relationship -->
  <div class="row align-items-center py-0">
    <div class="col-6 slot-sentence-col d-flex align-items-center justify-content-end YM fs-1">
      <span class="pron me-2">He/She</span>
      <span class="me-2">is my</span>
      <div id="relationships" class="inshade border rounded-3 bg-light text-center px-2"></div>
      <span class="ms-1">.</span>
    </div>
    <div class="col-6">
      <div id="group-relationships" class="d-flex flex-wrap align-items-center"></div>
    </div>
  </div>
  <hr class="my-1">

  <!-- Row 3: Personality -->
  <div class="row align-items-center py-0">
    <div class="col-6 slot-sentence-col d-flex align-items-center justify-content-end YM fs-1">
      <span class="pron me-2">He/She</span>
      <span class="me-2">is</span>
      <div id="personalities" class="inshade border rounded-3 bg-light text-center px-2"></div>
      <span class="ms-1">.</span>
    </div>
    <div class="col-6">
      <div id="group-personalities" class="d-flex flex-wrap align-items-center"></div>
    </div>
  </div>
  <hr class="my-1">

  <!-- Row 4: Skill -->
  <div class="row align-items-center py-0">
    <div class="col-6 slot-sentence-col d-flex align-items-center justify-content-end YM fs-1">
      <span class="pron me-2">He/She</span>
      <span class="me-2">can</span>
      <div id="skills" class="inshade border rounded-3 bg-light text-center px-2"></div>
      <span class="ms-1">well.</span>
    </div>
    <div class="col-6">
      <div id="group-skills" class="d-flex flex-wrap align-items-center"></div>
    </div>
  </div>
  <hr class="my-1">
</div>

<script>
  $(function () {
    $(".item").removeClass("active disabled");
    $("#thisis").addClass("active disabled");

    const ORIGINAL_DATA = {
      names: ["Ruby", "Priya", "Clara", "Aisha", "Paula", "Jing", "Peter", "Oscar", "Brian", "Carlos", "Scott", "Eric"],
      relationships: ["friend", "classmate", "grandmother", "grandfather", "mother", "father", "sister", "brother", "aunt", "uncle", "cousin", "teacher"],
      personalities: ["great", "active", "amazing", "interesting", "cool", "famous", "kind", "funny", "smart", "shy", "quiet", "friendly"],
      skills: ["dance", "sing", "draw", "swim", "skateboard", "jump rope", "play piano", "play guitar", "play drums", "play soccer", "play basketball", "play baseball"]
    };

    const NAMES_GENDER = {
      "Ruby": "f", "Priya": "f", "Clara": "f", "Aisha": "f", "Paula": "f", "Jing": "f",
      "Peter": "m", "Oscar": "m", "Brian": "m", "Carlos": "m", "Scott": "m", "Eric": "m"
    };

    const RELATIONSHIPS_GENDER = {
      "friend": "x", "classmate": "x", "grandmother": "f", "grandfather": "m",
      "mother": "f", "father": "m", "sister": "f", "brother": "m",
      "aunt": "f", "uncle": "m", "cousin": "x", "teacher": "x"
    };

    const COMBO_MAP = {
      1: "single",
      2: "double",
      3: "triple",
      4: "quadruple"
    };

    let pools = {};
    let statusMap = {};
    let totalGreenChecks = 0;
    let achievedCombos = new Set();

    function toId(str) {
      return str.replace(/ /g, '');
    }

    function populateSlotReels() {
      $("#names, #relationships, #personalities, #skills").empty();
      for (let catKey in ORIGINAL_DATA) {
        let slotElemId = "#" + catKey;
        $(slotElemId).append(`<div id="${catKey}_empty" class="fs-3 text-center YM slot-reel-item">&nbsp;</div>`);
        for (let item of ORIGINAL_DATA[catKey]) {
          let itemId = catKey + "_" + toId(item);
          $(slotElemId).append(`<div id="${itemId}" class="fs-3 text-center YM slot-reel-item">${item}</div>`);
        }
      }
    }

    function updateSpinButtonState() {
      let allPoolsEmpty = true;
      let allSelected = true;

      for (let catKey in ORIGINAL_DATA) {
        if (pools[catKey] && pools[catKey].length > 0) {
          allPoolsEmpty = false;
          let selected = $(`input[name="predict_${catKey}"]:checked`).val();
          if (!selected) {
            allSelected = false;
          }
        }
      }

      if (allPoolsEmpty) {
        $("#SPIN").addClass("disabled").prop("disabled", true);
        $("#RESET_GAME").removeClass("btn-outline-secondary").addClass("btn-success");
        return;
      }

      if (allSelected) {
        $("#SPIN").removeClass("disabled").prop("disabled", false);
      } else {
        $("#SPIN").addClass("disabled").prop("disabled", true);
      }
    }

    function initGame() {
      pools = {
        names: ORIGINAL_DATA.names.slice(),
        relationships: ORIGINAL_DATA.relationships.slice(),
        personalities: ORIGINAL_DATA.personalities.slice(),
        skills: ORIGINAL_DATA.skills.slice()
      };

      statusMap = {};
      for (let catKey in ORIGINAL_DATA) {
        statusMap[catKey] = {};
        for (let item of ORIGINAL_DATA[catKey]) {
          statusMap[catKey][item] = 'active';
        }
        $("#" + catKey).scrollTop(0);
      }

      totalGreenChecks = 0;
      achievedCombos.clear();

      $(".pron").text("He/She");
      $("#score-checks").text(0);
      $("#you-win-text").addClass("d-none");

      // Reset Reset button to outline secondary
      $("#RESET_GAME").removeClass("btn-success").addClass("btn-outline-secondary");

      // Reset Combo SVG paths to gray stroke
      $("#single, #double, #triple, #quadruple, #quintuple")
        .removeClass("combo-active")
        .css("stroke", "#646464")
        .attr("stroke", "#646464");

      renderAllOptionGroups(true);
      updateSpinButtonState();
    }

    function renderAllOptionGroups(clearChecked = false) {
      for (let catKey in ORIGINAL_DATA) {
        renderOptionGroup(catKey, clearChecked);
      }
    }

    function renderOptionGroup(catKey, clearChecked = false) {
      let groupContainer = $("#group-" + catKey);
      let currentlyChecked = clearChecked ? null : groupContainer.find(`input[name="predict_${catKey}"]:checked`).val();

      groupContainer.empty();

      let items = ORIGINAL_DATA[catKey];

      items.forEach((item) => {
        let st = statusMap[catKey][item];
        let sanitizedId = `radio_${catKey}_${toId(item)}`;

        if (st === 'active') {
          let isChecked = (!clearChecked && currentlyChecked === item) ? 'checked' : '';
          let radioHtml = `
          <div class="form-check form-check-inline me-2 my-0">
            <input class="form-check-input" type="radio" name="predict_${catKey}" id="${sanitizedId}" value="${item}" ${isChecked}>
            <label class="form-check-label text-dark fs-6" for="${sanitizedId}">${item}</label>
          </div>
        `;
          groupContainer.append(radioHtml);
        } else if (st === 'green_check') {
          let badgeHtml = `
          <span class="text-success fw-bold me-2 my-0 d-inline-flex align-items-center fs-6">
            <i class="material-icons fs-6 me-1">check_circle</i> ${item}
          </span>
        `;
          groupContainer.append(badgeHtml);
        }
      });
    }

    function runit() {
      let roundHits = 0;
      let hitResults = {};

      // 1. Pick hitName
      if (pools.names.length > 0) {
        let selectedItem = $(`input[name="predict_names"]:checked`).val();
        let randIndex = Math.floor(Math.random() * pools.names.length);
        let hitName = pools.names[randIndex];
        pools.names.splice(randIndex, 1);
        hitResults['names'] = { selected: selectedItem, hit: hitName };
      }

      // Update pronoun based on drawn hitName
      let sex = 'm';
      if (hitResults['names']) {
        sex = NAMES_GENDER[hitResults['names'].hit] || 'm';
      } else {
        let selectedName = $(`input[name="predict_names"]:checked`).val();
        if (selectedName && NAMES_GENDER[selectedName]) {
          sex = NAMES_GENDER[selectedName];
        }
      }
      $(".pron").text(sex === 'm' ? "He" : "She");

      // 2. Pick hitRelationship matching sex
      if (pools.relationships.length > 0) {
        let selectedItem = $(`input[name="predict_relationships"]:checked`).val();
        let matching = pools.relationships.filter(r => RELATIONSHIPS_GENDER[r] === sex || RELATIONSHIPS_GENDER[r] === 'x');
        let hitRel = null;

        if (matching.length > 0) {
          hitRel = matching[Math.floor(Math.random() * matching.length)];
          let idx = pools.relationships.indexOf(hitRel);
          pools.relationships.splice(idx, 1);
        } else {
          let randIndex = Math.floor(Math.random() * pools.relationships.length);
          hitRel = pools.relationships[randIndex];
          pools.relationships.splice(randIndex, 1);
        }
        hitResults['relationships'] = { selected: selectedItem, hit: hitRel };
      }

      // 3. Pick hitPersonality
      if (pools.personalities.length > 0) {
        let selectedItem = $(`input[name="predict_personalities"]:checked`).val();
        let randIndex = Math.floor(Math.random() * pools.personalities.length);
        let hitPers = pools.personalities[randIndex];
        pools.personalities.splice(randIndex, 1);
        hitResults['personalities'] = { selected: selectedItem, hit: hitPers };
      }

      // 4. Pick hitSkill
      if (pools.skills.length > 0) {
        let selectedItem = $(`input[name="predict_skills"]:checked`).val();
        let randIndex = Math.floor(Math.random() * pools.skills.length);
        let hitSkill = pools.skills[randIndex];
        pools.skills.splice(randIndex, 1);
        hitResults['skills'] = { selected: selectedItem, hit: hitSkill };
      }

      // Evaluate predictions for all categories
      for (let catKey in hitResults) {
        let res = hitResults[catKey];
        if (res.selected === res.hit) {
          statusMap[catKey][res.hit] = 'green_check';
          totalGreenChecks++;
          roundHits++;

          // Clear field (slot box) for items we get hits on
          $("#" + catKey).scrollTop(0);
        } else {
          statusMap[catKey][res.hit] = 'removed';
          spinit(catKey, catKey + '_' + toId(res.hit));
        }

        renderOptionGroup(catKey);
      }

      // Light up corresponding combo SVG path and award combo bonus value when first unlocked
      if (COMBO_MAP[roundHits]) {
        let comboPathId = COMBO_MAP[roundHits];
        if (!achievedCombos.has(comboPathId)) {
          achievedCombos.add(comboPathId);
          $("#" + comboPathId)
            .addClass("combo-active")
            .css("stroke", "#00ff66")
            .attr("stroke", "#00ff66");

          // Award bonus equal to the value of the combo (single: +1, double: +2, triple: +3, quadruple: +4)
          totalGreenChecks += roundHits;

          // Check if all 4 combos have been achieved!
          if (achievedCombos.size === 4) {
            $("#you-win-text").removeClass("d-none");
          }
        }
      }

      $("#score-checks").text(totalGreenChecks);

      updateSpinButtonState();
    }

    $(document).on('change', 'input[type="radio"]', function () {
      updateSpinButtonState();
    });

    $("#SPIN").on('click', function () {
      if ($(this).hasClass("disabled")) return;
      runit();
    });

    $("#RESET_GAME").on('click', function () {
      initGame();
    });

    populateSlotReels();
    initGame();
  });
</script>
