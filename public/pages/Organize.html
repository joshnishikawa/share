
<!DOCTYPE html>
<html lang="en-US" translate="no">
<head>
  <title>English Jones</title>
  
  <meta charset="utf-8">
  <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <link rel="stylesheet" href="//code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
  <script src="//code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-cookie@2/src/js.cookie.min.js"></script>

  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons%7CMaterial+Icons+Outlined">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/stylesheets/style.css">
  <style>
    .drag-handle { cursor: grab; color: #aaa; }
    .drag-handle:active { cursor: grabbing; }
    .card.selected { background-color: #e8f0fe; border-color: #6c9fef; }
    #output { white-space: pre-line; }
    .item-text:focus { outline: none; border-bottom: 1px solid #6c9fef; }
    .move-btn { cursor: pointer; color: #aaa; background: none; border: none; padding: 0 2px; display: inline-flex; align-items: center; transform: scale(2); transform-origin: center; }
    .move-btn:hover { color: #333; }
  </style>
</head>

<body>

<div class="container-fluid">
  <div class="row">
    <div class="col-2">
      <div class="form-check">
        <input type="radio" class="form-check-input" name="options" id="CSV" autocomplete="off" checked>
        <label class="form-check-label" for="CSV">CSV</label>
      </div>
      <div class="form-check">
        <input type="radio" class="form-check-input" name="options" id="OL" autocomplete="off">
        <label class="form-check-label" for="OL">Ordered List</label>
      </div>
      <br />
      <textarea class="form-control" id="list" placeholder="comma separated list to organize"></textarea>
      <div id="output"></div>
    </div>
    <div class="col-10">
      <div id="organize"></div>
    </div>
  </div>
</div>


<script>

function updateList() {
  var items = $('#organize .item-text').map(function() {
    return $(this).text().trim();
  }).get();
  $('#list').val(items.join(', '));
}

function updateOutput() {
  var items = $('#organize .item-text').map(function() {
    return $(this).text().trim();
  }).get();

  if ($('#CSV').is(':checked')) {
    $('#output').text(items.join(', '));
  } else if ($('#OL').is(':checked')) {
    var lines = items.map(function(item, i) {
      return (i + 1) + '. ' + item;
    });
    $('#output').text(lines.join('\n'));
  }
}

$(function() {
  $('#organize').sortable({
    handle: '.drag-handle',
    update: function(event, ui) {
      if (ui.item.find('.item-check').is(':checked')) {
        var others = $('#organize .card').filter(function() {
          return $(this).find('.item-check').is(':checked') && !$(this).is(ui.item);
        });
        ui.item.after(others);
      }
      $('#organize .item-check').prop('checked', false);
      $('#organize .card').removeClass('selected');
      updateList();
      updateOutput();
    }
  });

  $('#list').on('input', function() {
    var list = $(this).val().split(',').map(function(item) {
      return item.trim();
    }).filter(function(item) {
      return item.length > 0;
    });

    $('#organize').empty();
    list.forEach(function(item) {
      var card = $('<div class="card mb-1"></div>');
      var body = $('<div class="card-body d-flex align-items-center p-1"></div>');
      var handle = $('<span class="material-icons drag-handle me-1" style="font-size:1.1rem">drag_indicator</span>');
      var checkbox = $('<input type="checkbox" class="form-check-input item-check me-2" />')
        .on('change', function() {
          $(this).closest('.card').toggleClass('selected', $(this).is(':checked'));
        });
      var text = $('<span class="item-text ms-3" contenteditable="true" spellcheck="false"></span>').text(item)
        .on('input', function() {
          updateList();
          updateOutput();
        })
        .on('keydown', function(e) {
          if (e.key === 'Enter') { e.preventDefault(); $(this).blur(); }
        });
      var up = $('<button class="move-btn m-1" title="Move up">&#x25B4;</button>')
        .on('click', function() {
          var card = $(this).closest('.card');
          var prev = card.prev('.card');
          if (prev.length) { card.insertBefore(prev); updateList(); updateOutput(); }
        });
      var down = $('<button class="move-btn m-1" title="Move down">&#x25BE;</button>')
        .on('click', function() {
          var card = $(this).closest('.card');
          var next = card.next('.card');
          if (next.length) { card.insertAfter(next); updateList(); updateOutput(); }
        });
      body.append(handle).append(checkbox).append(up).append(down).append(text);
      card.append(body);
      $('#organize').append(card);
    });

    updateOutput();
  });

  $('input[name="options"]').on('change', function() {
    updateOutput();
  });
});

</script>
</body>
</html>
